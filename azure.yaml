# yaml-language-server: $schema=https://schema.digitalenv.org/schemas/v1/azure.yaml
name: shopping-list-app
version: v1.0.0
description: A shopping list app with sharing capabilities built with FastAPI, React, and PostgreSQL

infra:
  path: infra
  module: main.bicep

hooks:
  prebuild:
    shell: sh
    run: ./infra/hooks/prepackage.sh

  predeploy:
    shell: sh
    run: ./infra/hooks/pre-deploy-check.sh
    continueOnError: false  # Fail deployment if URL checks fail

postdeploy:
    shell: sh
    run: ./infra/hooks/verify-deployment.sh
    continueOnError: false  # Fail deployment if verification fails

services:
  web:
    project: ./frontend
    host: containerapp
    language: js
    docker:
      dockerfile: Dockerfile

  api:
    project: ./backend
    language: python
    host: containerapp

resources:
  postgres:
    type: database(postgres)
    database:
      version: "15"
