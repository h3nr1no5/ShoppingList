name: GHCR login test

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to ghcr.io with GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm push capability
        run: |
          TOKEN=$(curl -s -u "${{ github.repository_owner }}:${{ secrets.GITHUB_TOKEN }}" "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY,,}:pull,push" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))')
          echo "token_len=${#TOKEN}"
          curl -s -o /dev/null -w "tags_http=%{http_code}\n" -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/tags/list"
          code=$(curl -s -X POST -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/blobs/uploads/")
          echo "upload_session_http=$code"
          [ "$code" = "202" ] || exit 1
