name: Azure — Staging

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/azure-staging.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: azure-staging
  cancel-in-progress: true

env:
  ACI_NAME: shoppinglist-staging-azure
  RESOURCE_GROUP: ""

jobs:
  deploy-staging:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ---- Build & Push ----

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set lowercase repository name
        run: echo "REPOSITORY_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ env.REPOSITORY_LOWER }}:dev-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPOSITORY_LOWER }}:dev-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Push Docker image
        run: docker push ghcr.io/${{ env.REPOSITORY_LOWER }}:dev-${{ github.sha }}

      # ---- Azure Login & Resource Discovery ----

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get resource group
        id: resource_group
        run: |
          RG=$(az group list --query "[?contains(name, '${{ vars.AZURE_ENV_NAME || 'shoppinglistprod' }}')].name" -o tsv | head -1)
          if [ -z "$RG" ]; then
            RG=$(az group list --query '[0].name' -o tsv 2>/dev/null || echo "")
          fi
          if [ -z "$RG" ]; then
            echo "ERROR: Could not determine resource group"
            exit 1
          fi
          echo "RESOURCE_GROUP=$RG" >> "$GITHUB_ENV"
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"

      # ---- Spin Up ACI ----

      - name: Ensure no stale container exists
        run: |
          az container delete \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.ACI_NAME }}" \
            --yes 2>/dev/null || true

      - name: Create staging container instance
        env:
          ACI_SECRET_KEY: "${{ secrets.SECRET_KEY }}"
          ACI_REG_KEY: "${{ secrets.REGISTRATION_KEY }}"
          ACI_DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          ACI_REGISTRY_PASSWORD: "${{ secrets.GHCR_PAT }}"
          ACI_RESEND_KEY: "${{ secrets.RESEND_API_KEY }}"
        run: |
          az container create \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.ACI_NAME }}" \
            --image "ghcr.io/${{ env.REPOSITORY_LOWER }}:dev-${{ github.sha }}" \
            --cpu 1 --memory 1.5 \
            --registry-login-server ghcr.io \
            --registry-username ${{ github.actor }} \
            --registry-password "$ACI_REGISTRY_PASSWORD" \
            --environment-variables \
              "SECRET_KEY=$ACI_SECRET_KEY" \
              "REGISTRATION_KEY=$ACI_REG_KEY" \
              "DATABASE_URL=$ACI_DATABASE_URL" \
              "REGISTER_RATE_LIMIT=100/minute" \
              "LOGIN_RATE_LIMIT=200/minute" \
              "SHARED_LIST_RATE_LIMIT=500/minute" \
              "RESEND_API_KEY=$ACI_RESEND_KEY" \
              "FROM_EMAIL=noreply@shoppinglist.app" \
            --os-type Linux \
            --ip-address Public \
            --ports 8000 \
            --restart-policy Never

          echo "ACI created: ${{ env.ACI_NAME }}"

      - name: Wait for container IP
        id: ip
        run: |
          for i in $(seq 1 20); do
            IP=$(az container show \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --name "${{ env.ACI_NAME }}" \
              --query ipAddress.ip -o tsv 2>/dev/null)
            if [ -n "$IP" ]; then
              echo "ACI_IP=$IP" >> "$GITHUB_ENV"
              echo "STAGING_URL=http://$IP:8000" >> "$GITHUB_ENV"
              echo "staging_url=http://$IP:8000" >> "$GITHUB_OUTPUT"
              echo "Container IP: $IP"
              exit 0
            fi
            echo "Waiting for IP (attempt $i/20)..."
            sleep 5
          done
          echo "ERROR: Failed to get ACI IP after 20 attempts"
          exit 1

      # ---- Health Check ----

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.STAGING_URL }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy at ${{ env.STAGING_URL }}"
              exit 0
            fi
            echo "Attempt $i/30: Health check returned $STATUS, waiting..."
            sleep 3
          done
          echo "ERROR: App did not become healthy within 90 seconds"
          exit 1

      # ---- Smoke Tests (API only, no browser) ----

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run smoke tests against staging
        env:
          SMOKE_BASE_URL: "${{ env.STAGING_URL }}"
          SMOKE_REGISTRATION_KEY: "${{ secrets.REGISTRATION_KEY }}"
        run: |
          python backend/smoke_test.py

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run Playwright E2E against staging
        timeout-minutes: 15
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ env.STAGING_URL }}
          E2E_API_BASE_URL: ${{ env.STAGING_URL }}/api
          E2E_INVITE_CODE: ${{ secrets.REGISTRATION_KEY }}
          E2E_AUTH_FILE: ./e2e/.auth/user.json
        run: |
          for i in 1 2 3; do
            if npx playwright test --config=playwright.deploy.config.ts; then
              echo "Playwright E2E tests passed on attempt $i"
              exit 0
            fi
            echo "Playwright attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Playwright E2E tests failed after 3 attempts"
          exit 1

      - name: Cleanup ACI container
        if: always()
        run: |
          echo "Cleaning up ACI container: ${{ env.ACI_NAME }}"
          az container delete \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --name "${{ env.ACI_NAME }}" \
            --yes || echo "Container already gone or cleanup failed (non-blocking)"
