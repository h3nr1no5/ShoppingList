# GitHub Actions CI workflow for validating workflow YAML files
# This workflow runs actionlint to check all .github/workflows/*.yml files for syntax errors and best practices

name: CI — Validate Workflows

# Trigger on push and pull requests to main only
# This ensures we catch workflow errors before merging to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual triggering for debugging or re-running checks
  workflow_dispatch:

jobs:
  # Job to run actionlint on all workflow files
  actionlint:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to access workflow files
      - uses: actions/checkout@v5

      # Run actionlint to validate all .github/workflows/*.yml files
      # reviewdog/action-actionlint automatically detects and lints all workflow files
      # fail-on-error: true blocks PRs with invalid workflows from being merged
      - uses: reviewdog/action-actionlint@v1
        with:
          fail-on-error: true