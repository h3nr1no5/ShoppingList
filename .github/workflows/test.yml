name: Test

on:
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppinglist
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Run tests with PostgreSQL
        run: |
          source venv/bin/activate
          pytest -v
        env:
          SECRET_KEY: test-secret-key-for-ci
          REGISTRATION_KEY: test-registration-key

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run
        env:
          VITE_API_URL: ""  # Tests use vitest.config.ts setting, but explicitly set here for clarity

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (verify VITE_API_URL handling)
        run: |
          # Create a .env file with a test API URL to verify build works
          echo "VITE_API_URL=https://test-api.example.com" > .env
          npm run build
        env:
          # VITE_API_URL is read from .env file by Vite during build
          VITE_API_URL: https://test-api.example.com

  deploy-check:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Validate Bicep templates
        run: |
          az bicep build --file infra/main.bicep
          echo "✅ Bicep templates compiled successfully"

      - name: Build backend Docker image (validation only)
        run: |
          docker build -t backend-test ./backend
          echo "✅ Backend Docker image built successfully"

      - name: Create .env for frontend build
        run: |
          echo "VITE_API_URL=https://test.example.com" > frontend/.env

      - name: Build frontend Docker image (validation only)
        run: |
          docker build -t frontend-test ./frontend
          echo "✅ Frontend Docker image built successfully"

      - name: Cleanup .env
        run: rm -f frontend/.env

  frontend-e2e:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shoppinglist
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Create Python venv and install backend deps
        working-directory: backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start backend server
        working-directory: backend
        run: |
          source venv/bin/activate
          nohup bash ci-run.sh > /tmp/backend.log 2>&1 &
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done
        env:
          SECRET_KEY: ci-secret-key-for-e2e-tests
          REGISTRATION_KEY: ci-reg-key-for-e2e-tests

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          E2E_INVITE_CODE: ci-reg-key-for-e2e-tests
          REGISTRATION_KEY: ci-reg-key-for-e2e-tests

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7