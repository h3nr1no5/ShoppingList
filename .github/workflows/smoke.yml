name: Scheduled Smoke Test

on:
  schedule:
    # Run every 15 minutes to catch issues between deployments
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allow manual trigger from the Actions tab

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'shoppinglistprod' }}

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Get production URL
        run: |
          RG=$(az group list --query "[?contains(name, '${{ env.AZURE_ENV_NAME }}')].name" -o tsv | head -1)
          if [ -z "$RG" ]; then
            RG=$(az group list --query '[0].name' -o tsv 2>/dev/null || echo "")
          fi
          if [ -z "$RG" ]; then
            echo "ERROR: Could not determine resource group"
            exit 1
          fi

          APP_NAME="shoppinglist-app"
          APP_URL=$(az containerapp show \
            --name "$APP_NAME" \
            --resource-group "$RG" \
            --query properties.configuration.ingress.fqdn -o tsv)
          if [ -z "$APP_URL" ]; then
            echo "ERROR: Container app '$APP_NAME' not found in resource group $RG"
            exit 1
          fi
          echo "APP_URL=https://$APP_URL" >> "$GITHUB_ENV"

      - name: Verify deployment URL is set
        run: |
          if [ -z "${{ env.APP_URL }}" ]; then
            echo "ERROR: APP_URL is not set — 'Get production URL' step likely failed"
            exit 1
          fi

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: "${{ env.APP_URL }}"
          SMOKE_REGISTRATION_KEY: "${{ secrets.REGISTRATION_KEY }}"
        run: |
          python backend/smoke_test.py

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🚨 Scheduled smoke test failed — ${process.env.APP_URL}`;
            const body = [
              `Scheduled smoke test failed for \`${process.env.APP_URL}\`.`,
              '',
              `Check the workflow logs: https://github.com/${process.env.REPO}/actions/runs/${process.env.RUN_ID}`,
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'smoke-test-failure',
            });
            const isOpen = existing.some(i => i.title === title);
            if (!isOpen) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['smoke-test-failure'],
              });
              console.log('Created issue');
            } else {
              console.log('Issue already exists, skipping');
            }
        env:
          APP_URL: ${{ env.APP_URL }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
