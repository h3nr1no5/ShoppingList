name: Supabase — Staging Validation

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/supabase-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: supabase-staging
  cancel-in-progress: true

jobs:
  validate-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # ---- Build ----

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set lowercase repository name
        run: echo "REPOSITORY_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ghcr.io/${{ env.REPOSITORY_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Run ----

      - name: Run container with Supabase PostgreSQL
        run: |
          docker run --rm -d \
            --name supabase-staging \
            --network host \
            -e SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            -e REGISTRATION_KEY="${{ secrets.REGISTRATION_KEY }}" \
            -e DATABASE_URL="${{ secrets.SUPABASE_STAGING_DATABASE_URL }}" \
            -e DB_POOL_SIZE=2 \
            -e DB_MAX_OVERFLOW=1 \
            ghcr.io/${{ env.REPOSITORY_LOWER }}:${{ github.sha }}

      # ---- Health Check ----

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /tmp/health_response.txt -w "%{http_code}" http://localhost:8000/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "App is healthy"
              cat /tmp/health_response.txt
              exit 0
            fi
            echo "Attempt $i/30: HTTP $HTTP_CODE"
            cat /tmp/health_response.txt
            sleep 3
          done
          echo "ERROR: App did not become healthy within 90 seconds"
          exit 1

      # ---- Cleanup ----

      - name: Cleanup container
        if: always()
        run: |
          echo "Cleaning up container: supabase-staging"
          docker rm -f supabase-staging 2>/dev/null || echo "Container already gone or cleanup failed (non-blocking)"
