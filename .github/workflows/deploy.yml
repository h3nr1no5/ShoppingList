name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

permissions:
  id-token: write   # Required for OIDC
  contents: read   # Required to checkout repo

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'shoppinglistprod' }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      backend-pass: ${{ steps.backend.outcome }}
      frontend-pass: ${{ steps.frontend.outcome }}
    
    steps:
      - uses: actions/checkout@v4

      # Backend tests
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Backend tests
        id: backend
        working-directory: backend
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pytest -v
        env:
          SECRET_KEY: test-secret-key
          REGISTRATION_KEY: test-registration-key

      # Frontend tests  
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      
      - name: Frontend tests
        id: frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test:run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.pull_request.merged == true
    environment: production  # Requires approval for production
    
    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v1.0.0

      - name: Log in to Azure (OIDC)
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        shell: bash

      - name: Deploy with azd
        working-directory: infra
        run: |
          azd deploy --all --no-prompt
        env:
          # Key Vault name passed to Bicep (matches default in main.bicep)
          AZD_DEPLOY_PARAM_KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME || 'shoppinglist-kv' }}

      - name: Verify Deployment
        working-directory: infra
        run: |
          # Wait for deployment to stabilize
          sleep 30
          
          # Get URLs
          WEB_URL=$(azd show --output json | jq -r '.services.web.endpoint')
          API_URL=$(azd show --output json | jq -r '.services.api.endpoint')
          
          echo "Web: $WEB_URL"
          echo "API: $API_URL"
          
          # Health checks
          curl -f "$WEB_URL/" || (echo "❌ Web check failed"; exit 1)
          curl -f "$API_URL/health" || (echo "❌ API health check failed"; exit 1)
          
          echo "✅ Deployment verified!"

