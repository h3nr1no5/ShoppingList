name: Deploy to Azure

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'shoppinglistprod' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository name
        run: echo "REPOSITORY_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPOSITORY_LOWER }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get resource group and container app name
        run: |
          RG=$(az group list --query "[?contains(name, '${{ env.AZURE_ENV_NAME }}')].name" -o tsv | head -1)
          if [ -z "$RG" ]; then
            RG=$(az group list --query '[0].name' -o tsv 2>/dev/null || echo "")
          fi
          if [ -z "$RG" ]; then
            echo "ERROR: Resource group '${{ env.AZURE_ENV_NAME }}' not found"
            exit 1
          fi
          echo "RESOURCE_GROUP=$RG" >> "$GITHUB_ENV"

          CONTAINER_APP_NAME="shoppinglist-app"
          # Verify the container app exists
          az containerapp show --name "$CONTAINER_APP_NAME" --resource-group "$RG" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "ERROR: Container app '$CONTAINER_APP_NAME' not found in resource group $RG"
            exit 1
          fi
          echo "CONTAINER_APP_NAME=$CONTAINER_APP_NAME" >> "$GITHUB_ENV"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image ghcr.io/${{ env.REPOSITORY_LOWER }}:${{ github.sha }} \
            --set-env-vars "SECRET_KEY=${{ secrets.SECRET_KEY }}" "REGISTRATION_KEY=${{ secrets.REGISTRATION_KEY }}" \
            --registry-server ghcr.io \
            --registry-username ${{ github.actor }} \
            --registry-password ${{ secrets.GHCR_PAT }}

      - name: Get deployment URL
        run: |
          APP_URL=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "APP_URL=https://$APP_URL" >> "$GITHUB_ENV"

      - name: Verify deployment URL is set
        run: |
          if [ -z "${{ env.APP_URL }}" ]; then
            echo "ERROR: APP_URL is not set — 'Get deployment URL' step likely failed"
            exit 1
          fi

      - name: Store current revision for rollback
        id: prev-revision
        run: |
          PREV=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query "properties.latestRevisionName" -o tsv)
          echo "previous=$PREV" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Wait for app to be healthy
        run: |
          MAX_ATTEMPTS=30
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.APP_URL }}/health")
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy"
              exit 0
            fi
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Health check returned $STATUS, waiting..."
            sleep 10
          done
          echo "ERROR: App did not become healthy within $((MAX_ATTEMPTS * 10)) seconds"
          exit 1

      - name: Run smoke tests with retries
        env:
          SMOKE_BASE_URL: "${{ env.APP_URL }}"
          SMOKE_REGISTRATION_KEY: "${{ secrets.REGISTRATION_KEY }}"
        run: |
          for i in 1 2 3; do
            if python backend/smoke_test.py; then
              echo "Smoke tests passed"
              exit 0
            fi
            echo "Smoke test attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Smoke tests failed after 3 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, rolling back to previous revision..."
          az containerapp revision restore \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --revision "${{ steps.prev-revision.outputs.previous }}"
          echo "Rollback complete"