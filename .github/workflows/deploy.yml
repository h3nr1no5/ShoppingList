name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: write

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'shoppinglistprod' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

       - name: Build and push Docker image
         uses: docker/build-push-action@v6
         with:
           context: .
           push: true
           tags: ghcr.io/${{ github.repository | tolower }}:${{ github.sha }}

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get resource group and container app name
        run: |
          RG=$(az group list --query "[?contains(name, '${{ env.AZURE_ENV_NAME }}')].name" -o tsv | head -1)
          if [ -z "$RG" ]; then
            RG=$(az group list --query '[0].name' -o tsv 2>/dev/null || echo "")
          fi
          if [ -z "$RG" ]; then
            echo "ERROR: Could not determine resource group"
            exit 1
          fi
          echo "RESOURCE_GROUP=$RG" >> $GITHUB_ENV

          APP_NAME=$(az containerapp list \
            --resource-group "$RG" \
            --query '[0].name' -o tsv 2>/dev/null || echo "")
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: No container app found in resource group $RG"
            exit 1
          fi
          echo "CONTAINER_APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }} \
            --set-env-vars "SECRET_KEY=${{ secrets.SECRET_KEY }}" "REGISTRATION_KEY=${{ secrets.REGISTRATION_KEY }}" \
            --registry-server ghcr.io \
            --registry-username ${{ github.actor }} \
            --registry-password ${{ secrets.GHCR_PAT }}

      - name: Get deployment URL
        run: |
          APP_URL=$(az containerapp show \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "APP_URL=https://$APP_URL" >> $GITHUB_ENV

      - name: Verify deployment URL is set
        run: |
          if [ -z "${{ env.APP_URL }}" ]; then
            echo "ERROR: APP_URL is not set — 'Get deployment URL' step likely failed"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: "${{ env.APP_URL }}"
          SMOKE_REGISTRATION_KEY: "${{ secrets.REGISTRATION_KEY }}"
        run: |
          sleep 30
          python backend/smoke_test.py